services:
  miroind:
    build:
      context: .
    image: miroind:local
    container_name: miroind
    environment:
      MIROIND_OFFLINE_ONLY: "true"
      MIROIND_RUNS_DIR: /app/backend/uploads/miroind/runs
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
